<header class="p-3 shadow-md w-full">
  <div class="flex align-middle max-w-screen-2xl mx-auto justify-between items-center">
    <img routerLink="/" src="/images/logo.png" alt="Logo" class="max-h-16">
    <nav class="flex gap-3 my-2 uppercase text-xl">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
      <a routerLink="../shop" routerLinkActive="active">Shop</a>
      <a >Contact</a>
    </nav>
    <div class="flex gap-3 align-middle">
      <a matBadge="5" matBadgeSize=large class="custom-badge mt-2 mr-2">
        <mat-icon>shopping_cart</mat-icon>
      </a>
     <button mat-stroked-button>Login </button>
     <button mat-stroked-button>Sign up </button>
    </div>
    </div>
</header>
